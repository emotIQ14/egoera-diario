<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 341 384" width="341" height="384" aria-hidden="true">
  <!-- Fondo crema (matching los PNG) -->
  <rect width="341" height="384" fill="#f1ead8"/>

  <!-- Hombros + camiseta coral -->
  <path d="M 70 384 Q 70 320 110 305 L 230 305 Q 271 320 271 384 Z" fill="#d97757" stroke="#1d2bdb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cuello -->
  <path d="M 150 290 L 150 312 Q 170 320 190 312 L 190 290" fill="#c8e4dc" stroke="#1d2bdb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cara (forma oval ligeramente caída) -->
  <path d="M 110 180 Q 110 130 170 125 Q 230 130 230 180 Q 232 230 220 260 Q 200 290 170 292 Q 140 290 120 260 Q 108 230 110 180 Z" fill="#c8e4dc" stroke="#1d2bdb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Pelo: largo medio caído con flequillo despeinado -->
  <path d="M 108 178 Q 100 100 145 88 Q 200 80 235 100 Q 250 130 233 175 Q 235 185 233 195" fill="#1d2bdb" stroke="#1d2bdb" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Mechón derecho cayendo -->
  <path d="M 232 170 Q 240 200 235 240 Q 232 260 228 270" fill="#1d2bdb" stroke="#1d2bdb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mechón izquierdo cayendo -->
  <path d="M 110 170 Q 102 210 108 250 Q 110 265 116 275" fill="#1d2bdb" stroke="#1d2bdb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flequillo despeinado -->
  <path d="M 130 130 Q 145 115 165 122 M 175 120 Q 195 110 215 125" stroke="#1d2bdb" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Orejas (apenas visibles bajo el pelo) -->
  <path d="M 108 200 Q 100 210 105 230" stroke="#1d2bdb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 233 200 Q 240 210 236 230" stroke="#1d2bdb" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cejas ligeramente caídas (cansancio) -->
  <path d="M 130 195 Q 145 198 158 200" stroke="#1d2bdb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 182 200 Q 198 198 212 195" stroke="#1d2bdb" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Ojos cerrados (semi-cerrados con líneas curvas + pestañas tenues) -->
  <path d="M 130 218 Q 145 224 158 220" stroke="#1d2bdb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 182 220 Q 197 224 212 218" stroke="#1d2bdb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sombras bajo ojos (ojeras leves) -->
  <path d="M 132 230 Q 145 234 156 232" stroke="#1d2bdb" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M 184 232 Q 197 234 210 230" stroke="#1d2bdb" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Nariz sutil -->
  <path d="M 168 235 Q 168 248 165 255 Q 168 258 173 256" stroke="#1d2bdb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Boca: línea recta, ligeramente caída -->
  <path d="M 155 272 Q 170 270 185 273" stroke="#1d2bdb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
